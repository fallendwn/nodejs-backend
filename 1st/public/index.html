<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BMI calculator</title>
</head>
<body>
    
    <main>
        <h2>BMI calculator</h2>
        <div class="main-block">

        

            <form action="" id="main-form">
                
                <div>
                    <p class="input-text" >Input your height</p>
                    <input id="height-value" class="form-input" required type="text" placeholder="cm example (173)">
                </div>
                <div>
                    <p class="input-text">Input your body weight</p>
                    <input id="weight-value" class = "form-input" required type="text" placeholder="kg example (65)">
                </div>
                <div>
                    <input id="form-button" type="button" name="" value="CALCULATE">
                </div>


            </form>
            <div id = "placeholder-block">
                <p id = "final-answer"></p>
                <p id="result"></p>
            </div>
        </div>

    </main>

</body>
<script src="main.js"></script>
</html>
